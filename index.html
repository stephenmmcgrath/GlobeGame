<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Globe Game</title>
<style>
:root{--bg:#0b1420;--card:#13202f;--line:#25384d;--tx:#e8eef5;--mut:#8ea3b8;--acc:#f2b84b;--ok:#4cd08a;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:8px}
.hud>*{pointer-events:auto}
.pill{background:rgba(19,32,47,.88);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));background:rgba(19,32,47,.95);border:1px solid var(--line);border-radius:16px;padding:14px 16px;backdrop-filter:blur(6px)}
.big{font-size:26px;font-weight:700;margin:0}.sub{color:var(--mut);font-size:14px;margin:2px 0 10px}
button,select{font:inherit;color:var(--tx);background:#1d3047;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.menu{position:fixed;inset:0;background:rgba(6,12,20,.86);display:flex;padding:16px;overflow:auto;z-index:5}
.menu .box{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:auto}
h1{margin:0 0 4px;font-size:28px}h3{margin:16px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.opt{text-align:left}.opt.on{border-color:var(--acc);background:#2a2a1a;box-shadow:inset 0 0 0 1px var(--acc)}
input[type=text]{width:100%;font:inherit;color:var(--tx);background:#0e1927;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.list{max-height:190px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:#0e1927}
.list div{padding:8px 12px;cursor:pointer;border-bottom:1px solid #1a2b3d}.list div:hover{background:#1d3047}.list small{color:var(--mut)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 2px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--acc)}
.res b.ok{color:var(--ok)}.res b.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 3px;border-bottom:1px solid var(--line)}td.r{text-align:right}td.m{color:var(--mut);font-size:12px}
.zoom{position:fixed;right:12px;top:60px;display:flex;flex-direction:column;gap:6px;z-index:2}.zoom button{width:38px;height:38px;padding:0;font-size:20px}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:8px}.tabs button.on{border-color:var(--acc);background:#2a2a1a}
.hide{display:none!important}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><button id="home">☰ Menu</button><div class="pill" id="status"></div></div>
<div class="zoom"><button id="zi">+</button><button id="zo">−</button></div>
<div class="panel hide" id="panel"></div>

<div class="menu" id="menu"><div class="box">
<h1>🌍 Globe Game</h1><div class="sub">Drag to spin the globe (north stays up). Scroll or pinch to zoom.</div>
<h3>Game</h3>
<div class="row"><button class="opt on" data-mode="find"><b>Find the City</b><br><small>Given a name, tap it on the globe</small></button>
<button class="opt" data-mode="name"><b>Name the City</b><br><small>Given a dot, pick its name</small></button></div>
<label class="chk" id="ccWrap"><input type="checkbox" id="cc"> Also show the country with the city name</label>
<h3>Difficulty</h3>
<div class="row" id="diff"><button class="opt on" data-d="0">Capital Cities</button><button class="opt" data-d="1">Other Major Cities</button><button class="opt" data-d="2">Minor Cities</button><button class="opt" data-d="3">Towns</button></div>
<h3>Player</h3><input type="text" id="player" maxlength="20" placeholder="Your name">
<div class="row" style="margin-top:18px"><button class="pri" id="start" style="flex:2;padding:13px">Start</button><button id="scoresBtn" style="padding:13px">🏆 Scores</button></div>
<div class="sub" id="sync" style="margin:10px 0 0"></div>
</div></div>

<div class="menu hide" id="scores"><div class="box">
<div class="row" style="align-items:center"><h1 style="flex:3">🏆 Scores</h1><button id="scoresClose" style="flex:1">Close</button></div>
<div class="sub" id="scoresSrc"></div>
<div class="tabs"><button class="on" data-tab="top">Top scores</button><button data-tab="recent">Recent games</button></div>
<div class="row" id="scoreFilters"><select id="fGame"><option value="find0">Find the City</option><option value="find1">Find the City + country</option><option value="name">Name the City</option></select>
<select id="fDiff"><option value="0">Capital Cities</option><option value="1">Other Major Cities</option><option value="2">Minor Cities</option><option value="3">Towns</option></select></div>
<div id="scoreTable" style="margin-top:10px"></div>
</div></div>

<script src="three.min.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const $=id=>document.getElementById(id), ROUNDS=10, R2D=180/Math.PI, D2R=Math.PI/180;
const DIFF=["Capital Cities","Other Major Cities","Minor Cities","Towns"];
let CITIES=[], S={mode:"find",diff:0,showCountry:false}, G=null, sb=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try{const c=window.GEO_CONFIG||{};
  // tolerate a pasted API address like https://xxx.supabase.co/rest/v1/
  const url=(c.url||"").trim().replace(/\/rest\/v1.*$/,"").replace(/\/+$/,"");
  if(url&&c.key&&window.supabase) sb=supabase.createClient(url,c.key.trim());}catch(e){console.error(e);}
$("player").value=localStorage.getItem("gg_player")||"";
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

// ---------- local + synced storage ----------
const LKEY="gg_scores";
const getLocal=()=>{try{return JSON.parse(localStorage.getItem(LKEY)||"[]");}catch(e){return [];}};
const setLocal=a=>localStorage.setItem(LKEY,JSON.stringify(a.slice(-300)));
const strip=r=>({player:r.player,mode:r.mode,difficulty:r.difficulty,show_country:r.show_country,score:r.score,rounds:r.rounds,created_at:r.created_at});
async function syncPending(){
  if(!sb)return {ok:false,msg:"Supabase not configured"};
  const all=getLocal(),todo=all.filter(r=>!r.synced);
  if(todo.length){const {error}=await sb.from("geo_results").insert(todo.map(strip));
    if(error)return {ok:false,msg:error.message};
    todo.forEach(r=>r.synced=true);setLocal(all);}
  const t=await sb.from("geo_results").select("id",{count:"exact",head:true});
  return t.error?{ok:false,msg:t.error.message}:{ok:true,count:t.count};
}
async function checkSync(){
  const el=$("sync");
  if(!sb){el.textContent="Scores saved on this device only (Supabase not configured).";return;}
  el.textContent="Checking sync…";
  try{const r=await syncPending();el.textContent=r.ok?`☁️ Synced with Supabase · ${r.count} games recorded`:`⚠️ Sync problem: ${r.msg}. Scores are kept on this device.`;}
  catch(e){el.textContent="⚠️ Sync problem: "+e.message;}
}

// ---------- globe ----------
const canvas=$("c"), renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(40,1,.02,50); camera.position.z=3.4;
const globe=new THREE.Group(); scene.add(globe);
const maxTex=renderer.capabilities.getMaxTextureSize(), aniso=renderer.capabilities.getMaxAnisotropy();
const setTex=t=>{t.anisotropy=aniso;t.encoding=THREE.sRGBEncoding;if(sphere.material.map)sphere.material.map.dispose();sphere.material.map=t;sphere.material.needsUpdate=true;};
const sphere=new THREE.Mesh(new THREE.SphereGeometry(1,128,96),new THREE.MeshBasicMaterial({color:0x888888})); globe.add(sphere);
renderer.outputEncoding=THREE.sRGBEncoding;
const loader=new THREE.TextureLoader();
loader.load("earth_4k.jpg",t=>{setTex(t);
  const coarse=matchMedia("(pointer:coarse)").matches;
  const hd=(coarse||maxTex<8192)?(maxTex>=6144?"earth_6k.jpg":null):"earth_8k.jpg";
  if(hd)loader.load(hd,setTex);});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.04,64,48),new THREE.MeshBasicMaterial({color:0x5aa0ff,transparent:true,opacity:.12,side:THREE.BackSide})));
{const sp=[];for(let i=0;i<700;i++){const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);sp.push(20*Math.sin(b)*Math.cos(a),20*Math.cos(b),20*Math.sin(b)*Math.sin(a));}
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:.05,color:0x9fb6d0})));}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?55:40;camera.updateProjectionMatrix();}
addEventListener("resize",resize);resize();
const toVec=(lat,lon,r=1)=>{const t=(90-lat)*D2R,p=(lon+180)*D2R;return new THREE.Vector3(-r*Math.cos(p)*Math.sin(t),r*Math.cos(t),r*Math.sin(p)*Math.sin(t));};
const toLatLon=v=>({lat:Math.asin(v.y/v.length())*R2D,lon:Math.atan2(v.z,-v.x)*R2D-180});
function hav(a,b,c,d){const p=Math.PI/180,x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 12742*Math.asin(Math.sqrt(x));}
// north-up view: the globe never rolls, so north is always at the top
const view={lat:15,lon:-30};
function applyView(){
  const f=toVec(Math.max(-89.5,Math.min(89.5,view.lat)),view.lon);
  const u=new THREE.Vector3(0,1,0).addScaledVector(f,-f.y).normalize(), r=new THREE.Vector3().crossVectors(u,f);
  globe.quaternion.setFromRotationMatrix(new THREE.Matrix4().set(r.x,r.y,r.z,0,u.x,u.y,u.z,0,f.x,f.y,f.z,0,0,0,0,1));
}
// markers: translucent circles that stay the same size on screen
function circleTex(rgb){const c=document.createElement("canvas");c.width=c.height=128;const g=c.getContext("2d");
  g.fillStyle=`rgba(${rgb},.30)`;g.beginPath();g.arc(64,64,54,0,7);g.fill();
  g.lineWidth=5;g.strokeStyle=`rgba(${rgb},.95)`;g.stroke();
  g.fillStyle="rgba(255,255,255,.95)";g.beginPath();g.arc(64,64,3,0,7);g.fill();return new THREE.CanvasTexture(c);}
const TEX={amber:circleTex("242,184,75"),green:circleTex("76,208,138"),red:circleTex("255,90,90")};
let marks=[];
function clearMarks(){marks.forEach(m=>{globe.remove(m);if(m.geometry)m.geometry.dispose();});marks=[];}
function addDot(lat,lon,color){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:TEX[color],transparent:true,depthWrite:false,sizeAttenuation:false}));
  s.scale.set(.03,.03,1);s.position.copy(toVec(lat,lon,1.002));s.renderOrder=3;globe.add(s);marks.push(s);}
function addArc(a,b){const va=toVec(a.lat,a.lon),vb=toVec(b.lat,b.lon),ang=va.angleTo(vb),pts=[];
  for(let i=0;i<=48;i++){const t=i/48,s=Math.sin(ang);const v=s<1e-4?va.clone():va.clone().multiplyScalar(Math.sin((1-t)*ang)/s).add(vb.clone().multiplyScalar(Math.sin(t*ang)/s));pts.push(v.normalize().multiplyScalar(1.002+.03*Math.sin(t*Math.PI)*ang/3.14));}
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.75}));globe.add(l);marks.push(l);}
let anim=null;
function flyTo(lat,lon,z,ms=900){const f={lat:view.lat,lon:view.lon,z:camera.position.z},dl=((lon-f.lon+540)%360)-180,t0=performance.now();
  anim=t=>{const k=Math.min(1,(t-t0)/ms),e=k*k*(3-2*k);view.lat=f.lat+(lat-f.lat)*e;view.lon=f.lon+dl*e;if(z)camera.position.z=f.z+(z-f.z)*e;if(k>=1)anim=null;};}
function showBoth(a,b){const va=toVec(a.lat,a.lon),vb=toVec(b.lat,b.lon),ang=va.angleTo(vb),m=va.clone().add(vb);
  const c=m.length()<1e-3?b:toLatLon(m),z=Math.max(1.3,Math.min(4.2,1/Math.cos(Math.min(1.35,ang*.8+.12))));flyTo(c.lat,c.lon,z,1000);}
// interaction
const ptrs=new Map();let downAt=null,pinch=0;
const zoom=d=>{camera.position.z=Math.max(1.12,Math.min(5,camera.position.z+d*Math.max(.3,(camera.position.z-1)/2.4)));};
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});downAt={moved:0};anim=null;if(ptrs.size==2){const[a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);}});
canvas.addEventListener("pointermove",e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size==2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);zoom((pinch-d)*.01);pinch=d;if(downAt)downAt.moved=99;return;}
  if(downAt)downAt.moved+=Math.abs(dx)+Math.abs(dy);
  const k=.3*Math.max(camera.position.z-1,.2)/2.4*(800/innerHeight);
  view.lon=((view.lon-dx*k+540)%360)-180;view.lat=Math.max(-89,Math.min(89,view.lat+dy*k));});
canvas.addEventListener("pointerup",e=>{ptrs.delete(e.pointerId);if(downAt&&downAt.moved<6&&ptrs.size==0)clickGlobe(e);downAt=null;});
canvas.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);downAt=null;});
canvas.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY*.0025);},{passive:false});
$("zi").onclick=()=>zoom(-.5);$("zo").onclick=()=>zoom(.5);
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function clickGlobe(e){if(!G||G.mode!=="find"||G.locked)return;ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  applyView();globe.updateMatrixWorld(true);const h=ray.intersectObject(sphere)[0];if(!h)return;
  const ll=toLatLon(globe.worldToLocal(h.point.clone()));G.guess=ll;clearMarks();addDot(ll.lat,ll.lon,"amber");$("lock").disabled=false;}
(function loop(t){requestAnimationFrame(loop);if(anim)anim(t);applyView();renderer.render(scene,camera);})(0);

// ---------- game ----------
const fmt=c=>G.cc&&G.mode==="find"?`${c.n}, ${c.c}`:c.n;
const pts=d=>Math.round(1000*Math.exp(-d/1500));
function startGame(){
  const pool=CITIES.filter(c=>c.t===S.diff);
  G={mode:S.mode,diff:S.diff,cc:S.showCountry,picks:[...pool].sort(()=>Math.random()-.5).slice(0,ROUNDS),i:0,score:0,locked:false};
  $("menu").classList.add("hide");$("scores").classList.add("hide");nextRound();
}
function status(){$("status").textContent=`${G.mode==="find"?"Find":"Name"} · ${DIFF[G.diff]} · Round ${Math.min(G.i+1,ROUNDS)}/${ROUNDS} · ${G.score} pts`;}
function panel(html){const p=$("panel");p.innerHTML=html;p.classList.remove("hide");}
function nextRound(){
  if(G.i>=ROUNDS)return finish();
  G.locked=false;G.guess=null;G.sel=null;clearMarks();status();const c=G.picks[G.i];
  if(G.mode==="find"){
    flyTo(view.lat,view.lon,Math.max(camera.position.z,2.9),700);
    panel(`<p class="sub" style="margin:0">Where is…</p><p class="big">${esc(fmt(c))}</p><div style="height:10px"></div><button class="pri" id="lock" disabled style="width:100%">Lock in guess</button>`);
    $("lock").onclick=()=>{G.locked=true;const d=hav(G.guess.lat,G.guess.lon,c.lat,c.lon),p=pts(d);G.score+=p;
      addDot(c.lat,c.lon,"green");addArc(G.guess,c);showBoth(G.guess,c);
      result(`<b>${esc(c.n)}, ${esc(c.c)}</b> — you were <b>${Math.round(d).toLocaleString()} km</b> away.`,p);};
  }else{
    flyTo(c.lat,c.lon,2.4,900);addDot(c.lat,c.lon,"red");
    panel(`<p class="sub" style="margin:0">Which city is the red circle?</p><input type="text" id="q" placeholder="Type to search ${CITIES.length.toLocaleString()} places…" autocomplete="off"><div class="list hide" id="list"></div><div style="height:10px"></div><button class="pri" id="lock" disabled style="width:100%">Submit answer</button>`);
    const q=$("q"),list=$("list");
    const show=()=>{const s=norm(q.value.trim());G.sel=null;$("lock").disabled=true;if(!s){list.classList.add("hide");return;}
      const m=[];for(const x of CITIES){if(x.k.includes(s)){m.push(x);if(m.length>=60)break;}}
      m.sort((a,b)=>(b.k.startsWith(s))-(a.k.startsWith(s)));list.innerHTML="";
      m.forEach(x=>{const d=document.createElement("div");d.innerHTML=`${esc(x.n)} <small>${esc(x.c)}${x.dup?` · ${x.lat.toFixed(1)}°, ${x.lon.toFixed(1)}°`:""}</small>`;d.onclick=()=>{G.sel=x;q.value=`${x.n}, ${x.c}`;list.classList.add("hide");$("lock").disabled=false;};list.appendChild(d);});
      list.classList.toggle("hide",!m.length);};
    q.oninput=show;q.onkeydown=e=>{if(e.key==="Enter"){const f=list.firstChild;if(f&&!list.classList.contains("hide"))f.click();else if(G.sel)$("lock").click();}};
    $("lock").onclick=()=>{G.locked=true;const g=G.sel,ok=g===c,d=hav(g.lat,g.lon,c.lat,c.lon),p=ok?1000:Math.round(pts(d)*.6);G.score+=p;
      addDot(g.lat,g.lon,"amber");if(!ok){addArc(g,c);showBoth(g,c);}
      result(ok?`<b class="ok">Correct!</b> It's <b>${esc(c.n)}, ${esc(c.c)}</b>.`:`<b class="bad">Not quite.</b> It's <b>${esc(c.n)}, ${esc(c.c)}</b>; you chose ${esc(g.n)}, ${esc(g.c)} (${Math.round(d).toLocaleString()} km away).`,p);};
    setTimeout(()=>q.focus(),50);
  }
}
function result(msg,p){status();panel(`<div class="res"><p style="margin:0 0 8px">${msg}</p><p class="big" style="color:var(--acc)">+${p} pts</p></div><div style="height:10px"></div><button class="pri" id="next" style="width:100%">${G.i+1>=ROUNDS?"See results":"Next round"}</button>`);$("next").onclick=()=>{G.i++;nextRound();};}
async function finish(){
  clearMarks();status();flyTo(view.lat,view.lon,3.4,600);const name=($("player").value.trim()||"Player").slice(0,20);
  const rec={player:name,mode:G.mode,difficulty:G.diff,show_country:G.mode==="find"&&G.cc,score:G.score,rounds:ROUNDS,created_at:new Date().toISOString(),synced:false};
  const local=getLocal();local.push(rec);setLocal(local);
  panel(`<p class="big">Final score: ${G.score.toLocaleString()}</p><p class="sub">out of ${ROUNDS*1000}</p><div id="lb" class="sub">Saving…</div><div class="row"><button class="pri" id="again">Play again</button><button id="tomenu">Menu</button></div>`);
  $("again").onclick=startGame;$("tomenu").onclick=()=>{$("panel").classList.add("hide");$("menu").classList.remove("hide");checkSync();};
  let note="Saved on this device only.";
  if(sb){try{const r=await syncPending();note=r.ok?"☁️ Score synced.":`⚠️ Sync failed (${esc(r.msg)}) — saved on this device.`;}catch(e){note="⚠️ Sync failed — saved on this device.";}}
  const rows=await loadScores("top",rec.mode==="name"?"name":rec.show_country?"find1":"find0",rec.difficulty,10);
  const lb=$("lb");if(lb)lb.innerHTML=`<b>Top scores</b><table>${rows.map((r,i)=>`<tr><td>${i+1}. ${esc(r.player)}</td><td class="r">${r.score}</td></tr>`).join("")}</table><div style="margin-top:6px">${note}</div>`;
}
// ---------- scores screen ----------
let tab="top";
async function loadScores(kind,game,diff,limit=20){
  const mode=game==="name"?"name":"find",sc=game==="find1";
  if(sb){try{await syncPending();
    let q=sb.from("geo_results").select("player,mode,difficulty,show_country,score,created_at");
    if(kind==="top"){q=q.eq("mode",mode).eq("difficulty",diff);if(mode==="find")q=q.eq("show_country",sc);q=q.order("score",{ascending:false});}
    else q=q.order("created_at",{ascending:false});
    const r=await q.limit(limit);if(!r.error)return r.data;loadScores.err=r.error.message;}catch(e){loadScores.err=e.message;}}
  let a=getLocal();
  if(kind==="top")a=a.filter(r=>r.mode===mode&&r.difficulty===diff&&(mode==="name"||r.show_country===sc)).sort((x,y)=>y.score-x.score);
  else a=a.slice().reverse();
  return a.slice(0,limit);
}
const gname=r=>(r.mode==="name"?"Name":"Find"+(r.show_country?"+country":""))+" · "+DIFF[r.difficulty];
async function renderScores(){
  const el=$("scoreTable");el.innerHTML='<div class="sub">Loading…</div>';loadScores.err=null;
  $("scoreFilters").classList.toggle("hide",tab!=="top");
  const rows=await loadScores(tab,$("fGame").value,+$("fDiff").value);
  $("scoresSrc").textContent=sb?(loadScores.err?"⚠️ Could not reach Supabase ("+loadScores.err+"). Showing this device only.":"☁️ Scores from everyone using this game"):"Showing this device only.";
  if(!rows.length){el.innerHTML='<div class="sub">No scores yet — play a game!</div>';return;}
  el.innerHTML="<table>"+rows.map((r,i)=>tab==="top"
    ?`<tr><td>${i+1}. ${esc(r.player)}</td><td class="m">${new Date(r.created_at).toLocaleDateString()}</td><td class="r">${r.score}</td></tr>`
    :`<tr><td>${esc(r.player)}<br><span class="m">${esc(gname(r))}</span></td><td class="m">${new Date(r.created_at).toLocaleDateString()}</td><td class="r">${r.score}</td></tr>`).join("")+"</table>";
}
$("scoresBtn").onclick=()=>{$("fGame").value=S.mode==="name"?"name":S.showCountry?"find1":"find0";$("fDiff").value=S.diff;$("scores").classList.remove("hide");renderScores();};
$("scoresClose").onclick=()=>$("scores").classList.add("hide");
$("fGame").onchange=$("fDiff").onchange=renderScores;
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));renderScores();});
// ---------- menu wiring ----------
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));$("ccWrap").classList.toggle("hide",S.mode!=="find");});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.diff=+b.dataset.d;document.querySelectorAll("[data-d]").forEach(x=>x.classList.toggle("on",x===b));});
$("cc").onchange=e=>S.showCountry=e.target.checked;
$("start").onclick=()=>{localStorage.setItem("gg_player",$("player").value.trim());startGame();};
$("home").onclick=()=>{$("panel").classList.add("hide");clearMarks();$("menu").classList.remove("hide");checkSync();};
$("start").disabled=true;$("start").textContent="Loading places…";
fetch("cities.json").then(r=>r.json()).then(a=>{
  const seen={};a.forEach(x=>{const k=x[0]+"|"+x[1];seen[k]=(seen[k]||0)+1;});
  CITIES=a.map(x=>({n:x[0],c:x[1],lat:x[2],lon:x[3],t:x[4],k:norm(x[0]+" "+x[1]),dup:seen[x[0]+"|"+x[1]]>1}));
  $("start").disabled=false;$("start").textContent=`Start · ${ROUNDS} rounds`;
}).catch(()=>{$("start").textContent="Could not load cities.json";});
checkSync();
</script></body></html>
