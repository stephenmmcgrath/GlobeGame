<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Globe Game</title>
<style>
:root{--bg:#0b1420;--card:#13202f;--line:#25384d;--tx:#e8eef5;--mut:#8ea3b8;--acc:#f2b84b;--ok:#4cd08a;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:8px}
.hud>*{pointer-events:auto}
.pill{background:rgba(19,32,47,.88);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));background:rgba(19,32,47,.95);border:1px solid var(--line);border-radius:16px;padding:14px 16px;backdrop-filter:blur(6px)}
.big{font-size:26px;font-weight:700;margin:0}.sub{color:var(--mut);font-size:14px;margin:2px 0 10px}
button{font:inherit;color:var(--tx);background:#1d3047;border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.menu{position:fixed;inset:0;background:rgba(6,12,20,.86);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:5}
.menu .box{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:auto}
h1{margin:0 0 4px;font-size:28px}h3{margin:16px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.opt{text-align:left}.opt.on{border-color:var(--acc);background:#2a2a1a;box-shadow:inset 0 0 0 1px var(--acc)}
input[type=text]{width:100%;font:inherit;color:var(--tx);background:#0e1927;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.list{max-height:190px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:#0e1927}
.list div{padding:8px 12px;cursor:pointer;border-bottom:1px solid #1a2b3d}.list div:hover,.list div.hl{background:#1d3047}.list small{color:var(--mut)}
.chk{display:flex;gap:10px;align-items:center;padding:8px 2px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--acc)}
.res b.ok{color:var(--ok)}.res b.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:4px 2px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
.zoom{position:fixed;right:12px;top:60px;display:flex;flex-direction:column;gap:6px;z-index:2}.zoom button{width:38px;height:38px;padding:0;font-size:20px}
.hide{display:none!important}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><button id="home">☰ Menu</button><div class="pill" id="status"></div></div>
<div class="zoom"><button id="zi">+</button><button id="zo">−</button></div>
<div class="panel hide" id="panel"></div>

<div class="menu" id="menu"><div class="box">
<h1>🌍 Globe Game</h1><div class="sub">Drag to spin the globe, scroll or pinch to zoom.</div>
<h3>Game</h3>
<div class="row"><button class="opt on" data-mode="find"><b>Find the City</b><br><small>Given a name, tap it on the globe</small></button>
<button class="opt" data-mode="name"><b>Name the City</b><br><small>Given a dot, pick its name</small></button></div>
<label class="chk" id="ccWrap"><input type="checkbox" id="cc"> Also show the country with the city name</label>
<h3>Difficulty</h3>
<div class="row" id="diff"><button class="opt on" data-d="0">Capital Cities</button><button class="opt" data-d="1">Other Major Cities</button><button class="opt" data-d="2">Minor Cities</button><button class="opt" data-d="3">Towns</button></div>
<h3>Player</h3><input type="text" id="player" maxlength="20" placeholder="Your name">
<div style="margin-top:18px"><button class="pri" id="start" style="width:100%;padding:13px">Start · 10 rounds</button></div>
<div class="sub" id="sync" style="margin:10px 0 0"></div>
</div></div>

<script src="three.min.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const $=id=>document.getElementById(id), ROUNDS=10, R2D=180/Math.PI, D2R=Math.PI/180;
const DIFF=["Capital Cities","Other Major Cities","Minor Cities","Towns"];
let CITIES=[], S={mode:"find",diff:0,showCountry:false}, G=null, sb=null;
try{const c=window.GEO_CONFIG; if(c&&c.url&&c.key&&window.supabase) sb=supabase.createClient(c.url,c.key);}catch(e){}
$("sync").textContent=sb?"☁️ Scores sync via Supabase":"Scores saved on this device (add Supabase details in config.js to sync).";
$("player").value=localStorage.getItem("gg_player")||"";
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

// ---------- globe ----------
const canvas=$("c"), renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(40,1,.1,50); camera.position.z=3.4;
const globe=new THREE.Group(); scene.add(globe);
const tex=new THREE.TextureLoader().load("earth.jpg",()=>{}); tex.anisotropy=8;
const sphere=new THREE.Mesh(new THREE.SphereGeometry(1,96,64),new THREE.MeshBasicMaterial({map:tex})); globe.add(sphere);
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.04,64,48),new THREE.MeshBasicMaterial({color:0x5aa0ff,transparent:true,opacity:.12,side:THREE.BackSide})));
let starsGeo=new THREE.BufferGeometry(),sp=[];for(let i=0;i<700;i++){const v=new THREE.Vector3().randomDirection?0:0;const a=Math.random()*6.283,b=Math.acos(2*Math.random()-1);sp.push(20*Math.sin(b)*Math.cos(a),20*Math.cos(b),20*Math.sin(b)*Math.sin(a));}
starsGeo.setAttribute("position",new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({size:.05,color:0x9fb6d0})));
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?55:40;camera.updateProjectionMatrix();}
addEventListener("resize",resize);resize();
const toVec=(lat,lon,r=1)=>{const t=(90-lat)*D2R,p=(lon+180)*D2R;return new THREE.Vector3(-r*Math.cos(p)*Math.sin(t),r*Math.cos(t),r*Math.sin(p)*Math.sin(t));};
const toLatLon=v=>({lat:Math.asin(v.y/v.length())*R2D,lon:Math.atan2(v.z,-v.x)*R2D-180});
function hav(a,b,c,d){const p=Math.PI/180,x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 12742*Math.asin(Math.sqrt(x));}
let marks=[];
function clearMarks(){marks.forEach(m=>{globe.remove(m);m.geometry&&m.geometry.dispose();});marks=[];}
function addDot(lat,lon,color,size=.016){const m=new THREE.Mesh(new THREE.SphereGeometry(size,16,12),new THREE.MeshBasicMaterial({color}));m.position.copy(toVec(lat,lon,1.008));globe.add(m);marks.push(m);return m;}
function addArc(a,b,color){const va=toVec(a.lat,a.lon),vb=toVec(b.lat,b.lon),pts=[],n=48,ang=va.angleTo(vb);for(let i=0;i<=n;i++){const t=i/n;const s=Math.sin(ang);const v=s<1e-4?va.clone():va.clone().multiplyScalar(Math.sin((1-t)*ang)/s).add(vb.clone().multiplyScalar(Math.sin(t*ang)/s));pts.push(v.normalize().multiplyScalar(1.01+.04*Math.sin(t*Math.PI)*ang/3.14));}
 const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color}));globe.add(l);marks.push(l);}
let anim=null;
function faceTo(lat,lon,ms=900){const from=globe.quaternion.clone(),to=new THREE.Quaternion().setFromUnitVectors(toVec(lat,lon),new THREE.Vector3(0,0,1)),t0=performance.now();anim=t=>{const k=Math.min(1,(t-t0)/ms),e=k*k*(3-2*k);globe.quaternion.slerpQuaternions(from,to,e);if(k>=1)anim=null;};}
// interaction
const ptrs=new Map();let downAt=null,pinch=0;
const zoom=d=>{camera.position.z=Math.max(1.7,Math.min(5,camera.position.z+d));};
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});downAt={x:e.clientX,y:e.clientY,moved:0};anim=null;if(ptrs.size==2){const[a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);}});
canvas.addEventListener("pointermove",e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 if(ptrs.size==2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);zoom((pinch-d)*.01);pinch=d;if(downAt)downAt.moved=99;return;}
 if(downAt)downAt.moved+=Math.abs(dx)+Math.abs(dy);const k=.0055*(camera.position.z-.9)/2.5;
 const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(dy*k,dx*k,0,"XYZ"));globe.quaternion.premultiply(q);});
canvas.addEventListener("pointerup",e=>{ptrs.delete(e.pointerId);if(downAt&&downAt.moved<6&&ptrs.size==0)clickGlobe(e);downAt=null;});
canvas.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);downAt=null;});
canvas.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY*.002);},{passive:false});
$("zi").onclick=()=>zoom(-.4);$("zo").onclick=()=>zoom(.4);
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function clickGlobe(e){if(!G||G.mode!=="find"||G.locked)return;ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
 const h=ray.intersectObject(sphere)[0];if(!h)return;const ll=toLatLon(globe.worldToLocal(h.point.clone()));G.guess=ll;clearMarks();addDot(ll.lat,ll.lon,0xf2b84b,.02);$("lock").disabled=false;}
(function loop(t){requestAnimationFrame(loop);if(anim)anim(t);renderer.render(scene,camera);})(0);

// ---------- game ----------
const fmt=c=>S.showCountry&&G.mode==="find"?`${c.n}, ${c.c}`:c.n;
const pts=d=>Math.round(1000*Math.exp(-d/1500));
function startGame(){
  const pool=CITIES.filter(c=>c.t===S.diff);
  const picks=[...pool].sort(()=>Math.random()-.5).slice(0,ROUNDS);
  G={mode:S.mode,diff:S.diff,cc:S.showCountry,picks,i:0,score:0,locked:false};
  $("menu").classList.add("hide");nextRound();
}
function status(){$("status").textContent=`${G.mode==="find"?"Find":"Name"} · ${DIFF[G.diff]} · Round ${Math.min(G.i+1,ROUNDS)}/${ROUNDS} · ${G.score} pts`;}
function panel(html){const p=$("panel");p.innerHTML=html;p.classList.remove("hide");}
function nextRound(){
  if(G.i>=ROUNDS)return finish();
  G.locked=false;G.guess=null;G.sel=null;clearMarks();status();const c=G.picks[G.i];
  if(G.mode==="find"){
    panel(`<p class="sub" style="margin:0">Where is…</p><p class="big">${fmt(c)}</p><div style="height:10px"></div><button class="pri" id="lock" disabled style="width:100%">Lock in guess</button>`);
    $("lock").onclick=()=>{G.locked=true;const d=hav(G.guess.lat,G.guess.lon,c.lat,c.lon),p=pts(d);G.score+=p;
      addDot(c.lat,c.lon,0x4cd08a,.02);addArc(G.guess,c,0xffffff);faceTo((G.guess.lat+c.lat)/2,Math.abs(G.guess.lon-c.lon)>180?c.lon:(G.guess.lon+c.lon)/2);
      result(`<b>${c.n}, ${c.c}</b> — you were <b>${Math.round(d).toLocaleString()} km</b> away.`,p);};
  }else{
    faceTo(c.lat,c.lon,700);addDot(c.lat,c.lon,0xff5a5a,.022);
    panel(`<p class="sub" style="margin:0">Which city is the red dot?</p><input type="text" id="q" placeholder="Type to search ${CITIES.length.toLocaleString()} places…" autocomplete="off"><div class="list hide" id="list"></div><div style="height:10px"></div><button class="pri" id="lock" disabled style="width:100%">Submit answer</button>`);
    const q=$("q"),list=$("list");
    const show=()=>{const s=norm(q.value.trim());if(!s){list.classList.add("hide");return;}
      const m=[];for(const x of CITIES){if(x.k.includes(s)){m.push(x);if(m.length>=60)break;}}
      m.sort((a,b)=>(b.k.startsWith(s))-(a.k.startsWith(s)));
      list.innerHTML="";m.forEach(x=>{const d=document.createElement("div");d.innerHTML=`${x.n} <small>${x.c}${x.dup?` · ${x.lat.toFixed(1)}°, ${x.lon.toFixed(1)}°`:""}</small>`;d.onclick=()=>{G.sel=x;q.value=`${x.n}, ${x.c}`;list.classList.add("hide");$("lock").disabled=false;};list.appendChild(d);});
      list.classList.toggle("hide",!m.length);G.sel=null;$("lock").disabled=true;};
    q.oninput=show;q.onkeydown=e=>{if(e.key==="Enter"){const f=list.firstChild;if(f&&!list.classList.contains("hide"))f.click();else if(G.sel)$("lock").click();}};
    $("lock").onclick=()=>{G.locked=true;const g=G.sel,ok=g===c,d=hav(g.lat,g.lon,c.lat,c.lon),p=ok?1000:Math.round(pts(d)*.6);G.score+=p;
      addDot(g.lat,g.lon,0xf2b84b,.02);if(!ok)addArc(g,c,0xffffff);
      result(ok?`<b class="ok">Correct!</b> It's <b>${c.n}, ${c.c}</b>.`:`<b class="bad">Not quite.</b> It's <b>${c.n}, ${c.c}</b>; you chose ${g.n}, ${g.c} (${Math.round(d).toLocaleString()} km away).`,p);};
    setTimeout(()=>q.focus(),50);
  }
}
function result(msg,p){status();panel(`<div class="res"><p style="margin:0 0 8px">${msg}</p><p class="big" style="color:var(--acc)">+${p} pts</p></div><div style="height:10px"></div><button class="pri" id="next" style="width:100%">${G.i+1>=ROUNDS?"See results":"Next round"}</button>`);$("next").onclick=()=>{G.i++;nextRound();};}
async function finish(){
  clearMarks();status();const name=($("player").value.trim()||"Player").slice(0,20);
  const rec={player:name,mode:G.mode,difficulty:G.diff,show_country:G.mode==="find"&&G.cc,score:G.score,rounds:ROUNDS};
  panel(`<p class="big">Final score: ${G.score.toLocaleString()}</p><p class="sub">out of ${ROUNDS*1000}</p><div id="lb" class="sub">Saving…</div><div class="row"><button class="pri" id="again">Play again</button><button id="tomenu">Menu</button></div>`);
  $("again").onclick=startGame;$("tomenu").onclick=()=>{$("panel").classList.add("hide");$("menu").classList.remove("hide");};
  let rows=[];const key="gg_scores";const local=JSON.parse(localStorage.getItem(key)||"[]");local.push({...rec,created_at:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(local.slice(-200)));
  if(sb){try{await sb.from("geo_results").insert(rec);let q=sb.from("geo_results").select("player,score").eq("mode",rec.mode).eq("difficulty",rec.difficulty);if(rec.mode==="find")q=q.eq("show_country",rec.show_country);const r=await q.order("score",{ascending:false}).limit(10);rows=r.data||[];}catch(e){}}
  if(!rows.length)rows=local.filter(r=>r.mode===rec.mode&&r.difficulty===rec.difficulty&&r.show_country===rec.show_country).sort((a,b)=>b.score-a.score).slice(0,10);
  const lb=$("lb");if(lb)lb.innerHTML=`<b>Top scores${sb?" (everyone)":" (this device)"}</b><table>${rows.map((r,i)=>`<tr><td>${i+1}. ${r.player.replace(/</g,"&lt;")}</td><td>${r.score}</td></tr>`).join("")}</table>`;
}
// menu wiring
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));$("ccWrap").classList.toggle("hide",S.mode!=="find");});
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.diff=+b.dataset.d;document.querySelectorAll("[data-d]").forEach(x=>x.classList.toggle("on",x===b));});
$("cc").onchange=e=>S.showCountry=e.target.checked;
$("start").onclick=()=>{localStorage.setItem("gg_player",$("player").value.trim());startGame();};
$("home").onclick=()=>{$("panel").classList.add("hide");clearMarks();$("menu").classList.remove("hide");};
$("start").disabled=true;$("start").textContent="Loading places…";
fetch("cities.json").then(r=>r.json()).then(a=>{
  const seen={};a.forEach(x=>{const k=x[0]+"|"+x[1];seen[k]=(seen[k]||0)+1;});
  CITIES=a.map(x=>({n:x[0],c:x[1],lat:x[2],lon:x[3],t:x[4],k:norm(x[0]+" "+x[1]),dup:seen[x[0]+"|"+x[1]]>1}));
  $("start").disabled=false;$("start").textContent=`Start · ${ROUNDS} rounds`;
}).catch(()=>{$("start").textContent="Could not load cities.json";});
</script></body></html>
